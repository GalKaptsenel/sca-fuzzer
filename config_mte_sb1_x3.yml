# MTE tag-check speculative-exception on the Pixel 8, targeting templates/mte_oracle.py with cross-input
# priming reporting BOTH self-dependent and cross-input leaks. Contract = cond + bpas, SSBS=1. The NI
# seal-lane regime keeps the microarchitectural leftover alive across inputs: SSBS on, no pre-run
# flush, no PHR flush, no view rotation, unpinned.
instruction_set: aarch64
instruction_categories:
  - MTE
  - MTE-TAGMEM
  - BASE-ARITH
  - BASE-LOGICAL
  - BASE-SHIFT
  - BASE-BITFIELD
  - BASE-CONDSEL
  - BASE-BRANCH
  - BASE-MEM-LOAD
  - BASE-MEM-STORE
min_bb_per_function: 5
max_bb_per_function: 5
max_successors_per_bb: 2
min_successors_per_bb: 1
fuzzer: speculative-exception
input_generator: aarch64-nzcv

contract_execution_clause:
  - cond
  - bpas
contract_observation_clause: l1d
enable_speculative_store_bypass: true

executor_mode: F+R
executor_pinned_core: 8
superbatch_size: 1
enable_pre_run_flush: false
inputs_per_class: 2

# Generalized (cross-input) priming over the seal lanes; report self- and cross-input leaks both.
enable_cross_input_priming: true
cross_input_leaks_only: false

executor_remote: true
executor_remote_transport: adb
executor_remote_host: 127.0.0.1
executor_remote_port: 5037
executor_remote_device: /dev/executor
executor_remote_sysfs: /sys/executor
executor_remote_userland: /data/local/tmp/executor_userland
executor_remote_module: /data/local/tmp/revizor-executor.ko
