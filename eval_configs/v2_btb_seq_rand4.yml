# Spectre-v2 (indirect branch) / real BTB — FULLY RANDOM (no template), CT-SEQ, RICHER control flow.
# CT-SEQ makes the speculative dispatch/target beyond-contract so the target-selecting bits are UNTAINTED;
# boosting then varies them -> a which-target cross-input leak. No sealing.
# rand4 fix: rand1-3 used linear control flow (max_successors_per_bb=1) so a dispatch could never sit
# behind an architecturally-not-taken (speculatively-taken) branch -- the template's gadget shape. Richer
# CF (>=2 BBs, up to 2 successors) lets random programs place a dispatch in a speculative-only block.
instruction_set: aarch64
instruction_categories:
  - BASE-ARITH
  - BASE-LOGICAL
  - BASE-SHIFT
  - BASE-CONDSEL
  - BASE-BRANCH
  - BASE-MEM-LOAD
  - BASE-MEM-STORE
fuzzer: basic
input_generator: aarch64-nzcv
executor_mode: P+P
program_size: 32
min_functions_per_test_case: 5
max_functions_per_test_case: 6
function_call_probability: 0.9
max_calls_per_function: 1
indirect_call_probability: 1.0
dispatch_call_probability: 1.0
contract_execution_clause:
  - seq
contract_observation_clause: l1d
model_min_nesting: 1
model_max_nesting: 30
enable_pre_run_flush: false
executor_pinned_core: -1
enable_cross_input_priming: true
cross_input_priming_localizer: optimal
cross_input_leaks_only: true
inputs_per_class: 4
enable_speculative_store_bypass: true
function_size_shrink: 0.5
avg_mem_accesses: 10
min_bb_per_function: 2
max_bb_per_function: 4
min_successors_per_bb: 1
max_successors_per_bb: 2
