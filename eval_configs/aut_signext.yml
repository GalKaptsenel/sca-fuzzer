instruction_set: aarch64
# PAC + sign-extension NI fuzzing: each memory access is PAC-authenticated, and the speculative decoy
# also breaks the authed pointer's sign-extension (a bit-55 / regime-selector flip) so it faults. Needs
# the PAC category.
instruction_categories:
  - PAC
  - BASE-ARITH
  - BASE-LOGICAL
  - BASE-SHIFT
  - BASE-BITFIELD
  - BASE-CONDSEL
  - BASE-BRANCH
  - BASE-MEM-LOAD
  - BASE-MEM-STORE
min_bb_per_function: 5
max_bb_per_function: 5
max_successors_per_bb: 2
min_successors_per_bb: 1
fuzzer: non-interference
input_generator: aarch64-nzcv
pac_seal_prob: 1.0
pac_strip_prob: 0.0
enable_signext: true
signext_seal_prob: 1.0
contract_execution_clause:
  - cond

executor_pinned_core: 90

# --- explicit measurement knobs (no reliance on defaults) ---
contract_observation_clause: l1d
executor_mode: P+P
enable_pre_run_flush: true
executor_warmups: 5
enable_priming: true
