instruction_set: aarch64
instruction_categories:
  - BASE-ARITH
  - BASE-LOGICAL
  - BASE-SHIFT
  - BASE-BITFIELD
  - BASE-CONDSEL
  - BASE-BRANCH
  - BASE-MEM-LOAD
  - BASE-MEM-STORE
  - BASE-FLAGOP
  - BASE-BITCOUNT
  - BASE-CRC
  - BASE-BITBYTE
min_bb_per_function: 2
max_bb_per_function: 5
max_successors_per_bb: 2
min_successors_per_bb: 1
fuzzer: basic
input_generator: aarch64-nzcv
enable_pre_run_flush: 1
executor_warmups: 5
input_gen_seed: 0

executor_pinned_core: 90

contract_execution_clause:
  - cond
