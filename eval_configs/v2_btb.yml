# Hunt Spectre-v2 (branch-target injection) via RANDOM fuzzing + the boosted-lane leftover detector.
# No template: the generator emits data-dependent DISPATCH indirect calls (ADR table; LDRSW; ADD; BLR),
# whose BTB entry an earlier input can train; a later ct-equal input then speculatively jumps to the
# mistrained target. That indirect-target misprediction is not modelled by [cond, bpas], so it surfaces
# as a violation; enable_cross_input_priming localizes which earlier input trained it (the leaking pair).
instruction_set: aarch64
instruction_categories:
  - BASE-ARITH
  - BASE-LOGICAL
  - BASE-SHIFT
  - BASE-CONDSEL
  - BASE-BRANCH
  - BASE-MEM-LOAD
  - BASE-MEM-STORE
fuzzer: basic
input_generator: aarch64-nzcv
executor_mode: P+P

# Program shape: a few functions reached through data-dependent indirect dispatch (the v2 gadget).
# Call graph kept small/bounded: dispatch x speculative nesting blows the contract trace up exponentially.
program_size: 24
min_functions_per_test_case: 2
max_functions_per_test_case: 3
function_call_probability: 0.9
indirect_call_probability: 1.0
dispatch_call_probability: 1.0
max_calls_per_function: 1

# Contract models conditional + store-bypass speculation; indirect-target misprediction is left out,
# so a cross-input BTB leftover registers as a violation.
contract_execution_clause:
  - cond
  - bpas
# FEW calls (<=2 total, bounded above) make HIGH nesting tractable -- the contract-trace blow-up scaled
# with call/dispatch count, not nesting depth. So model speculation deeply (30) to explain v1/v4/nested
# speculation fully: a surviving violation is then genuinely beyond-contract (indirect-target = v2), not
# an artifact of under-modelled deep speculation.
model_min_nesting: 1
model_max_nesting: 30

# Preserve cross-input BTB training: no per-input view rotation / PHR flush (my measurement.c fix makes
# any PHR reset per-trace, not per-input). P+P re-primes L1D each measurement, damping cache reuse.
enable_pre_run_flush: false

# Cross-input priming replaces standard priming (reuses priming's sample sizes; default
# localizer 'any' = galloping + bisection, set cross_input_priming_localizer: optimal for t*).
enable_cross_input_priming: true
inputs_per_class: 4

executor_pinned_core: 90
