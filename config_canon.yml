instruction_set: aarch64
# Canonicality NI needs no PAC/MTE category — it seals the ordinary loads/stores below.
instruction_categories:
  - BASE-ARITH
  - BASE-LOGICAL
  - BASE-SHIFT
  - BASE-BITFIELD
  - BASE-CONDSEL
  - BASE-BRANCH
  - BASE-MEM-LOAD
  - BASE-MEM-STORE
min_bb_per_function: 5
max_bb_per_function: 5
max_successors_per_bb: 2
min_successors_per_bb: 1
fuzzer: non-interference
input_generator: aarch64-nzcv
enable_canonicality: true
canonicality_seal_prob: 1.0   # P(seal an eligible memory access as canonical/non-canonical pair)
# va_size defaults from the device; canonicality_mask: 0x800000000000 probes a single boundary
enable_speculative_store_bypass: true   # v4/SSB: SSBS=1 => store bypass ALLOWED (mitigation OFF)
contract_execution_clause:      # contract models v1 (cond) + v4 (bpas) speculation
  - cond
  - bpas
