instruction_set: aarch64
fuzzer: speculative-exception
speculative_exception_mode: strict
input_generator: aarch64-nzcv
executor_mode: P+P
program_size: 24
max_functions_per_test_case: 8
max_calls_per_function: 1
max_successors_per_bb: 2
min_successors_per_bb: 1
